# @package _global_
defaults:
  - /model/pelif_cnn_yolox: default

training:
  precision: 16
  max_steps: 400000
  learning_rate: 0.0001
  lr_scheduler:
    use: True
    total_steps: ${..max_steps}
    pct_start: 0.005
    div_factor: 20
    final_div_factor: 10000
validation:
  check_val_every_n_epoch: 1
dataset:
  train:
    sampling: 'mixed'
    mixed: { w_stream: 1, w_random: 1 }
  eval:
    sampling: 'stream'
  ev_repr_name: 'stacked_histogram_dt=50_nbins=10'
  sequence_length: 21
logging:
  ckpt_every_n_train_steps: 500
