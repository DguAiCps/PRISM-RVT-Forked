# @package _global_
# PeLIF-CNN with 3x3 recurrent kernel and stacked PeLIFConvBlocks.
# Every layer is recurrent (matching sMNIST PeLIFRecurrentLayer design).
# With rec_kernel_size=3, signals propagate spatially through recurrence.
defaults:
  - override /model: rnndet

model:
  backbone:
    name: PeLIFCNN
    input_channels: 20
    embed_dim: 64
    dim_multiplier: [1, 2, 4, 8]
    num_conv_layers: [2, 2, 2, 2]
    periods: [1, 2, 4, 8]
    rec_kernel_size: 3
    norm: none
    enable_masking: false
    stem:
      patch_size: 4
    pelif:
      beta_init: 0.9
      learn_beta: true
      threshold: 0.5
      surrogate: triangle
  fpn:
    name: PAFPN
    compile: { enable: false, args: { mode: reduce-overhead } }
    depth: 0.67
    in_stages: [2, 3, 4]
    depthwise: false
    act: "silu"
  head:
    name: YoloX
    compile: { enable: false, args: { mode: reduce-overhead } }
    depthwise: false
    act: "silu"
  postprocess:
    confidence_threshold: 0.1
    nms_threshold: 0.45
