# @package _global_
# PeLIF-CNN + spike-driven attention (Spikformer-style window + grid).
# Every stage: PeLIFConvBlock × N → SpikePartitionAttention (window+grid) → PeLIFNeuron readout
defaults:
  - override /model: rnndet

model:
  backbone:
    name: PeLIFCNNAttn
    input_channels: 20
    embed_dim: 64
    dim_multiplier: [1, 2, 4, 8]
    num_conv_layers: [1, 1, 1, 1]
    periods: [1, 2, 4, 8]
    rec_kernel_size: 3
    norm: none
    partition_split_32: 1       # partition_size = (H/32, W/32) = (8, 10) for 256x320
    enable_masking: false
    stem:
      patch_size: 4
    pelif:
      beta_init: 0.9
      learn_beta: true
      threshold: 0.5
      surrogate: triangle
    attention:
      partition_size: ???       # filled by config/modifier.py
      dim_head: 32
      threshold: 1.0
      beta_init: 0.9
      learn_beta: true
      qkv_bias: false
  fpn:
    name: PAFPN
    compile: { enable: false, args: { mode: reduce-overhead } }
    depth: 0.67
    in_stages: [2, 3, 4]
    depthwise: false
    act: "silu"
  head:
    name: YoloX
    compile: { enable: false, args: { mode: reduce-overhead } }
    depthwise: false
    act: "silu"
  postprocess:
    confidence_threshold: 0.1
    nms_threshold: 0.45
