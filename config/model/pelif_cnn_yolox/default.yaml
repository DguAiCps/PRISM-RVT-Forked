# @package _global_
defaults:
  - override /model: rnndet

model:
  backbone:
    name: PeLIFCNN
    input_channels: 20
    embed_dim: 64
    dim_multiplier: [1, 2, 4, 8]
    num_conv_layers: [2, 2, 2, 2]
    periods: [1, 2, 4, 8]
    enable_masking: false
    stem:
      patch_size: 4
    snn:
      beta_init: 0.9
      learn_beta: true
      threshold: 1.0
      reset_mechanism: subtract
      channelwise_beta: false
      beta_spread: 0.0
    pelif:
      beta_init: 0.9
      learn_beta: true
      threshold: 1.0
  fpn:
    name: PAFPN
    compile: { enable: false, args: { mode: reduce-overhead } }
    depth: 0.67
    in_stages: [2, 3, 4]
    depthwise: false
    act: "silu"
  head:
    name: YoloX
    compile: { enable: false, args: { mode: reduce-overhead } }
    depthwise: false
    act: "silu"
  postprocess:
    confidence_threshold: 0.1
    nms_threshold: 0.45
